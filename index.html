<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabinet Médical Pro V6</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><div class="login-card"><div class="logo">⚕️</div><h1>Cabinet Médical Pro</h1><p>Simulation médicale — données fictives</p><label>Médecin</label><select id="doctor"><option value="raphael">Raphaël</option><option value="jade">Jade</option><option value="victoria">Victoria</option></select><label>Mot de passe</label><input id="password" type="password" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Se connecter</button><button type="button" class="danger" onclick="resetLocalData()">Réinitialiser les données locales</button><p id="err"></p></div></div>

</aside><main id="main"></main></div></div><div id="modal" class="modal" hidden><div class="modal-box"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script src="app.js"></script></body></html>
